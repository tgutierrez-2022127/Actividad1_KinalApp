<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Clientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h1 { color: #FFD700; }
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.3);
            cursor: pointer;
        }
        .btn:hover { background: rgba(255,215,0,0.2); }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
        }
        .table-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #FFD700; border-bottom: 1px solid rgba(255,215,0,0.3); }
        td { padding: 12px 15px; color: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(255,255,255,0.1); }
        tr:hover { background: rgba(255,215,0,0.1); }
        .btn-group { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .estado-activo { color: #05DFA0; }
        .estado-inactivo { color: #FF4757; }
        .alert-success {
            background: rgba(5, 223, 160, 0.2);
            border: 1px solid #05DFA0;
            color: #05DFA0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> Gestion de Clientes</h1>
        <a href="/principal" class="btn">← Volver</a>
    </div>

    <div class="btn-group">
        <a href="/clientes/nuevo" class="btn btn-primary"> Nuevo Cliente</a>
    </div>

    <div class="table-container">
        <h2 style="color: #FFD700; margin-bottom: 15px;"> Listado de Clientes</h2>
        <div th:if="${exito}" class="alert-success" th:text="${exito}"></div>

        <table>
            <thead>
            <tr>
                <th>DPI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Direccion</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.dpiCliente}">-</td>
                <td th:text="${cliente.nombreCliente}">-</td>
                <td th:text="${cliente.apellidoCliente}">-</td>
                <td th:text="${cliente.direccion}">-</td>
                <td>
                    <span th:if="${cliente.estado == 1}" class="estado-activo">Activo</span>
                    <span th:if="${cliente.estado == 0}" class="estado-inactivo">Inactivo</span>
                    <span th:if="${cliente.estado == null}" class="estado-inactivo">Inactivo</span>
                </td>
                <td>
                    <button class="btn" onclick="eliminarCliente('[[${cliente.dpiCliente}]]')">🗑️ Eliminar</button>
                </td>
            </tr>
            <tr th:if="${clientes.empty}">
                <td colspan="6" style="text-align:center">No hay clientes registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function eliminarCliente(dpi) {
        if (confirm('¿Eliminar este cliente?')) {
            fetch('/api/clientes/' + dpi, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        alert('Cliente eliminado');
                        location.reload();
                    } else {
                        alert('Error al eliminar');
                    }
                });
        }
    }
</script>
</body>
</html>
