<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .form-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: #FFD700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFD700;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-back {
            background: transparent;
            border: 1px solid #FFD700;
            color: #FFD700;
            margin-top: 10px;
        }

        .btn-back:hover {
            background: #FFD700;
            color: #1A1A2E;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <h1>➕ Nueva Venta</h1>

        <form action="/ventas/guardar" method="post" th:object="${venta}">
            <div class="form-group">
                <label>Total (Q)</label>
                <input type="number" step="0.01" th:field="*{total}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}" required>
                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Cliente</label>
                <select th:field="*{cliente.dpiCliente}" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.dpiCliente}"
                            th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente + ' - ' + cliente.dpiCliente}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Usuario</label>
                <select th:field="*{usuario.idUsuario}" required>
                    <option value="">Seleccione un usuario</option>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.idUsuario}"
                            th:text="${usuario.nombre + ' ' + usuario.apellido + ' - ' + usuario.correo}"></option>
                </select>
            </div>

            <button type="submit" class="btn"> Guardar Venta</button>
            <a href="/ventas" class="btn btn-back">← Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
