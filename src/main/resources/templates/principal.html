<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Panel Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h1 { color: #FFD700; }
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.3);
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
        }
        .btn-logout { background: #ff4757; border: none; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: block;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .card-icon { font-size: 3rem; margin-bottom: 15px; }
        .card h2 { color: #FFD700; margin-bottom: 10px; font-size: 1.5rem; }
        .card p { color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; }
        .role-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .role-admin { background: #FF4757; color: white; }
        .role-client { background: #05DFA0; color: #1A1A2E; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .stat-number { font-size: 2rem; font-weight: 700; color: #FFD700; }
        .stat-label { color: rgba(255, 255, 255, 0.6); font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1> KinalApp</h1>
            <p>Bienvenido, <span sec:authentication="name"></span></p>
        </div>
        <div>
            <span sec:authorize="hasRole('ADMIN')" class="role-badge role-admin"> Administrador</span>
            <span sec:authorize="hasRole('CLIENTE')" class="role-badge role-client"> Cliente</span>
            <form action="/logout" method="post" style="display: inline-block; margin-left: 15px;">
                <button type="submit" class="btn btn-logout"> Cerrar Sesión</button>
            </form>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalClientes">0</div>
            <div class="stat-label">Clientes Registrados</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalProductos">0</div>
            <div class="stat-label">Productos en Inventario</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalVentas">0</div>
            <div class="stat-label">Ventas Realizadas</div>
        </div>
    </div>

    <div class="cards">
        <a href="/clientes-view" class="card">
            <div class="card-icon"></div>
            <h2>Clientes</h2>
            <p>Ver información de clientes</p>
        </a>

        <a href="/productos-view" class="card">
            <div class="card-icon"></div>
            <h2>Productos</h2>
            <p>Ver productos del inventario</p>
        </a>

        <a href="/ventas-view" class="card">
            <div class="card-icon"></div>
            <h2>Ventas</h2>
            <p>Registrar y consultar ventas</p>
        </a>

        <a href="/detalle-venta-view" class="card">
            <div class="card-icon"></div>
            <h2>Detalle Ventas</h2>
            <p>Visualizar detalles de cada venta</p>
        </a>
    </div>
</div>

<script>
    fetch('/api/clientes').then(r=>r.json()).then(d=>document.getElementById('totalClientes').innerText=d.length).catch(e=>document.getElementById('totalClientes').innerText='0');
    fetch('/api/productos').then(r=>r.json()).then(d=>document.getElementById('totalProductos').innerText=d.length).catch(e=>document.getElementById('totalProductos').innerText='0');
    fetch('/api/ventas').then(r=>r.json()).then(d=>document.getElementById('totalVentas').innerText=d.length).catch(e=>document.getElementById('totalVentas').innerText='0');
</script>

</body>
</html>
