<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Panel Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .rol-badge {
            background: rgba(255, 215, 0, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #FFD700;
        }

        .btn-logout {
            padding: 10px 25px;
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #FF6B6B;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff4757;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #FFD700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: block;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .admin-badge {
            background: #ff4757;
            color: white;
            padding: 2px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-area">
            <img src="/images/Kinal.png" alt="KinalApp" class="logo-img" onerror="this.style.display='none'">
            <div>
                <div class="logo-text">KinalApp</div>
                <p class="rol-badge" sec:authorize="hasRole('ADMIN')">Administrador</p>
                <p class="rol-badge" sec:authorize="hasRole('CLIENTE')">Cliente</p>
            </div>
        </div>
        <form action="/logout" method="post">
            <button type="submit" class="btn-logout">Cerrar Sesion</button>
        </form>
    </div>

    <!-- Estadisticas -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalClientes">0</div>
            <div class="stat-label">Clientes Registrados</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalProductos">0</div>
            <div class="stat-label">Productos en Inventario</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalVentas">0</div>
            <div class="stat-label">Ventas Realizadas</div>
        </div>
    </div>

    <div class="cards">
        <a href="/clientes-view" class="card">
            <div class="card-icon"></div>
            <h2>Clientes</h2>
            <p>Gestionar informacion de clientes</p>
            <span sec:authorize="hasRole('ADMIN')" class="admin-badge">Admin</span>
        </a>

        <a href="/productos-view" class="card">
            <div class="card-icon"></div>
            <h2>Productos</h2>
            <p>Administrar inventario y precios</p>
            <span sec:authorize="hasRole('ADMIN')" class="admin-badge">Admin</span>
        </a>

        <!-- NUEVA TARJETA DE VENTAS - con enlace correcto -->
        <a href="/ventas" class="card">
            <div class="card-icon"></div>
            <h2>Ventas</h2>
            <p>Registrar y consultar ventas</p>
        </a>

        <a href="/detalle-venta-view" class="card">
            <div class="card-icon"></div>
            <h2>Detalle Ventas</h2>
            <p>Visualizar detalles de cada venta</p>
        </a>
    </div>
</div>

<script>
    function cargarEstadisticas() {
        fetch('/api/clientes')
            .then(res => res.json())
            .then(data => document.getElementById('totalClientes').innerText = data.length)
            .catch(e => document.getElementById('totalClientes').innerText = '0');

        fetch('/api/productos')
            .then(res => res.json())
            .then(data => document.getElementById('totalProductos').innerText = data.length)
            .catch(e => document.getElementById('totalProductos').innerText = '0');

        fetch('/api/ventas')
            .then(res => res.json())
            .then(data => document.getElementById('totalVentas').innerText = data.length)
            .catch(e => document.getElementById('totalVentas').innerText = '0');
    }
    cargarEstadisticas();
</script>
</body>
</html>
