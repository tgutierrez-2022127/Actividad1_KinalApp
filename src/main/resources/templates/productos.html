<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%); min-height: 100vh; }
        .navbar { background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 215, 0, 0.3); }
        .navbar h2 { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; padding: 8px 15px; border-radius: 10px; }
        .nav-links a:hover { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .user-info { color: #FFD700; margin-left: 20px; font-size: 14px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .card { background: rgba(26, 26, 46, 0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255, 215, 0, 0.3); }
        .card h2 { color: #FFD700; margin-bottom: 25px; }
        .btn { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #1A1A2E; text-decoration: none; border-radius: 10px; font-weight: 600; margin-bottom: 20px; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; margin-left: 10px; }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 215, 0, 0.2); }
        th { color: #FFD700; }
        .action-link { color: #FFD700; text-decoration: none; margin-right: 10px; }
        .text-muted { color: rgba(255, 255, 255, 0.5); font-style: italic; }
    </style>
</head>
<body>
<div class="navbar">
    <h2>KinalApp</h2>
    <div class="nav-links">
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/detalle-ventas}">Detalle Ventas</a>
        <a th:href="@{/logout}">Cerrar Sesion</a>
        <span class="user-info">Usuario: [[${#authentication.name}]] - <span sec:authorize="hasRole('ADMIN')">Administrador</span><span sec:authorize="hasRole('USER')">Cliente</span></span>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2>Listado de Productos</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/productos/nuevo}" class="btn">Nuevo Producto</a>
        <a th:href="@{/}" class="btn btn-secondary">Volver</a>
        <div th:if="${productos == null or productos.empty}">
            <p style="color: white;">No hay productos registrados.</p>
        </div>
        <div th:unless="${productos == null or productos.empty}">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.idProducto}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.descripcion}"></td>
                    <td th:text="${producto.precio}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}" class="action-link">Editar</a>
                        <a th:href="@{/productos/eliminar/{id}(id=${producto.idProducto})}" class="action-link" onclick="return confirm('Eliminar?')">Eliminar</a>
                    </td>
                    <td sec:authorize="hasRole('USER')"><span class="text-muted">Solo lectura</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
