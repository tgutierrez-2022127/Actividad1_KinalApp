<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - KinalApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { color: #667eea; }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }
        .btn-volver { background: #6c757d; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1> Gestión de Productos</h1>
    <a href="/" class="btn btn-volver">← Volver al inicio</a>
    <a href="/api/productos" class="btn"> Ver API (JSON)</a>

    <h3> Lista de Productos</h3>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${productos}">
            <td th:text="${producto.idProducto}">1</td>
            <td th:text="${producto.nombre}">Producto</td>
            <td th:text="${producto.descripcion}">Descripción</td>
            <td th:text="'Q' + ${producto.precio}">0</td>
            <td th:text="${producto.stock}">0</td>
        </tr>
        <tr th:if="${productos.empty}">
            <td colspan="5" style="text-align:center">No hay productos registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
