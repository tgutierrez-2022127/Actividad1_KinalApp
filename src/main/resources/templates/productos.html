<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .navbar h2 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 15px;
            border-radius: 10px;
        }
        .nav-links a:hover { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .card {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 215, 0, 0.2); }
        th { color: #FFD700; }
        a { color: #FFD700; text-decoration: none; }
    </style>
</head>
<body>
<div class="navbar">
    <h2> KinalApp</h2>
    <div class="nav-links">
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/logout}">Cerrar Sesión</a>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2 style="color: #FFD700; margin-bottom: 20px;"> Productos</h2>
        <a th:href="@{/productos/nuevo}" class="btn">+ Nuevo Producto</a>
        <a th:href="@{/}" class="btn" style="background: rgba(255,255,255,0.2); color:white; margin-left:10px;">Cancelar</a>
        <table>
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.idProducto}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.descripcion}"></td>
                <td th:text="${producto.precio}"></td>
                <td th:text="${producto.stock}"></td>
                <td><a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}">Editar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
