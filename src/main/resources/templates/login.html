<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo-text {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #FFD700; }
        input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 15px;
            color: white;
        }
        input:focus { outline: none; border-color: #FFD700; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.3); }
        .error-message {
            background: rgba(255,71,87,0.2);
            border: 1px solid rgba(255,71,87,0.5);
            color: #FF6B6B;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .register-link { text-align: center; margin-top: 20px; }
        .register-link a { color: #FFD700; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo-text"> KinalApp</div>
    <p class="subtitle">Sistema de Gestión Empresarial</p>

    <div th:if="${param.error}" class="error-message">
         Usuario o contraseña incorrectos
    </div>
    <div th:if="${param.logout}" class="error-message" style="background:rgba(5,223,160,0.2); border-color:rgba(5,223,160,0.5); color:#05DFA0;">
         Has cerrado sesión exitosamente
    </div>
    <div th:if="${param.registro}" class="error-message" style="background:rgba(5,223,160,0.2); border-color:rgba(5,223,160,0.5); color:#05DFA0;">
         ¡Registro exitoso! Ahora puedes iniciar sesión
    </div>

    <form action="/login" method="post">
        <div class="form-group">
            <label> Correo Electrónico</label>
            <input type="email" name="username" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label> Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn"> Ingresar al Sistema</button>
    </form>

    <div class="register-link">
        <a th:href="@{/registro}"> ¿No tienes cuenta? Regístrate aquí</a>
    </div>
</div>
</body>
</html>
