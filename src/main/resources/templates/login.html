<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFD700;
            font-weight: 500;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-registro {
            display: block;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #FFD700;
            color: #FFD700;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            margin-top: 15px;
        }

        .btn-registro:hover {
            background: #FFD700;
            color: #1A1A2E;
            transform: translateY(-2px);
        }

        .error-message {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #FF6B6B;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .success-message {
            background: rgba(5, 223, 160, 0.2);
            border: 1px solid rgba(5, 223, 160, 0.5);
            color: #05DFA0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .credentials {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        .credentials span {
            color: #FFD700;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="/images/Kinal.png" alt="KinalApp" class="logo-img" onerror="this.style.display='none'">
        <div class="logo-text">KinalApp</div>
    </div>
    <p class="subtitle">Sistema de Gestion Empresarial</p>

    <div th:if="${param.error}" class="error-message">
        Usuario o contrasena incorrectos
    </div>

    <div th:if="${param.logout}" class="success-message">
        Has cerrado sesion exitosamente
    </div>

    <div th:if="${exito}" class="success-message" th:text="${exito}"></div>

    <form action="/login" method="post">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="admin@kinal.com" required>
        </div>

        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" placeholder="Ingrese su contrasena" required>
        </div>

        <button type="submit" class="btn">Ingresar al Sistema</button>
    </form>

    <!-- Boton para crear cuenta -->
    <a href="/registro" class="btn-registro">Crear Cuenta</a>

    <div class="credentials">
        <p>Usuario: <span>admin@kinal.com</span> | Contrasena: <span>admin123</span></p>
    </div>
</div>

</body>
</html>
