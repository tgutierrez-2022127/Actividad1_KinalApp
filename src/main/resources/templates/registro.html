<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFD700;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            font-size: 0.95rem;
            color: white;
        }

        select option {
            background: #1A1A2E;
            color: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .error-message {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #FF6B6B;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .login-link {
            margin-top: 25px;
        }

        .login-link a {
            color: #FFD700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="logo-text">KinalApp</div>
    <p class="subtitle">Crear una cuenta</p>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" placeholder="Tu apellido" required>
        </div>

        <div class="form-group">
            <label>Correo Electronico</label>
            <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" th:field="*{password}" placeholder="..." required>
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="ADMIN">Administrador</option>
                <option value="USER">Cliente</option>
            </select>
        </div>

        <button type="submit" class="btn">Registrarse</button>
    </form>

    <div class="login-link">
        <a th:href="@{/login}">Ya tienes cuenta? Inicia sesion</a>
    </div>
</div>

</body>
</html>
