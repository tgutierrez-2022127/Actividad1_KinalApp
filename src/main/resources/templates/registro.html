<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .logo-text { text-align: center; font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #FFD700; }
        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 15px;
            color: white;
        }
        select option { background: #1A1A2E; }
        input:focus, select:focus { outline: none; border-color: #FFD700; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .error-message {
            background: rgba(255,71,87,0.2);
            border: 1px solid rgba(255,71,87,0.5);
            color: #FF6B6B;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #FFD700; text-decoration: none; }
    </style>
</head>
<body>
<div class="register-container">
    <div class="logo-text"> KinalApp</div>
    <p class="subtitle">Crear una cuenta</p>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label> Nombre</label>
            <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
            <label> Apellido</label>
            <input type="text" th:field="*{apellido}" placeholder="Tu apellido" required>
        </div>
        <div class="form-group">
            <label> Correo Electrónico</label>
            <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label> Contraseña</label>
            <input type="password" th:field="*{password}" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label> Rol</label>
            <select name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="ADMIN">Administrador</option>
                <option value="USER">Cliente</option>
            </select>
        </div>
        <button type="submit" class="btn"> Registrarse</button>
    </form>

    <div class="login-link">
        <a th:href="@{/login}">← ¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>
</body>
</html>
