<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { color: #667eea; }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }
        .btn-logout {
            background: #ff4757;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.3s;
            display: block;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #667eea;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> KinalApp</h1>
        <a href="/logout" class="btn btn-logout"> Cerrar Sesión</a>
    </div>

    <p>Bienvenido al sistema de gestión</p>

    <div class="cards">
        <a href="/clientes-view" class="card">
            <h2> Clientes</h2>
            <p>Gestionar clientes</p>
        </a>
        <a href="/productos-view" class="card">
            <h2> Productos</h2>
            <p>Gestionar productos</p>
        </a>
        <a href="/ventas-view" class="card">
            <h2> Ventas</h2>
            <p>Gestionar ventas</p>
        </a>
        <a href="/detalle-venta-view" class="card">
            <h2> Detalle Ventas</h2>
            <p>Gestionar detalles</p>
        </a>
    </div>
</div>
</body>
</html>
