<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Ventas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h1 { color: #FFD700; }
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.3);
            cursor: pointer;
        }
        .table-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #FFD700; border-bottom: 1px solid rgba(255,215,0,0.3); }
        td { padding: 12px 15px; color: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(255,255,255,0.1); }
        tr:hover { background: rgba(255,215,0,0.1); }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .stat-number { font-size: 2rem; font-weight: 700; color: #FFD700; }
        .stat-label { color: rgba(255, 255, 255, 0.6); font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Detalle de Ventas</h1>
        <a href="/principal" class="btn">← Volver</a>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalDetalles">0</div>
            <div class="stat-label">Total Detalles</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalProductosVendidos">0</div>
            <div class="stat-label">Productos Vendidos</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalIngresos">Q0</div>
            <div class="stat-label">Ingresos Totales</div>
        </div>
    </div>

    <div class="table-container">
        <h2 style="color: #FFD700; margin-bottom: 15px;">📋 Listado de Detalles de Venta</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Venta ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.idDetalle}">-</td>
                <td th:text="${d.venta != null ? d.venta.idVenta : 'N/A'}">-</td>
                <td th:text="${d.producto != null ? d.producto.nombre : 'N/A'}">-</td>
                <td th:text="${d.cantidad}">0</td>
                <td th:text="'Q' + ${d.precio}">-</td>
                <td th:text="'Q' + ${d.cantidad * d.precio}">-</td>
            </tr>
            <tr th:if="${detalles.empty}">
                <td colspan="6" style="text-align:center">No hay detalles de venta registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    fetch('/api/detalle-venta')
        .then(r=>r.json())
        .then(data => {
            document.getElementById('totalDetalles').innerText = data.length;
            let productos = 0, ingresos = 0;
            data.forEach(d => {
                productos += d.cantidad || 0;
                ingresos += (d.cantidad || 0) * (d.precio || 0);
            });
            document.getElementById('totalProductosVendidos').innerText = productos;
            document.getElementById('totalIngresos').innerText = 'Q' + ingresos.toFixed(2);
        })
        .catch(e => console.log('No hay detalles'));
</script>
</body>
</html>
