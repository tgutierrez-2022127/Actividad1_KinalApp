<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Detalle de Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: #FFD700;
            font-size: 1.8rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #FFA500, #FFD700);
        }

        /* Tarjetas de estadisticas */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #FFD700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        /* Tabla */
        .table-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            color: #FFD700;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }

        .total-general {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
            text-align: right;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .total-general span {
            color: #FFD700;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Alertas */
        .alert-success {
            background: rgba(5, 223, 160, 0.2);
            border: 1px solid #05DFA0;
            color: #05DFA0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> Detalle de Ventas</h1>
        <div>
            <a href="/ventas" class="btn"> Ventas</a>
            <a href="/principal" class="btn">← Volver</a>
        </div>
    </div>

    <!-- Estadisticas -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalDetalles">0</div>
            <div class="stat-label">Detalles Registrados</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalProductosVendidos">0</div>
            <div class="stat-label">Productos Vendidos</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalIngresos">Q0</div>
            <div class="stat-label">Ingresos Totales</div>
        </div>
    </div>

    <div th:if="${exito}" class="alert-success" th:text="${exito}"></div>

    <!-- Tabla de detalles -->
    <div class="table-container">
        <h2 style="color: #FFD700; margin-bottom: 15px;"> Listado de Detalles de Venta</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Venta ID</th>
                <th>Código Venta</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Subtotal</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="detalle : ${detalles}">
                <td th:text="${detalle.idDetalle}">-</td>
                <td th:text="${detalle.venta != null ? detalle.venta.idVenta : 'N/A'}">-</td>
                <td th:text="${detalle.venta != null ? detalle.venta.codigoGenerico : 'N/A'}">-</td>
                <td th:text="${detalle.producto != null ? detalle.producto.nombre : 'N/A'}">-</td>
                <td th:text="${detalle.cantidad}">0</td>
                <td th:text="'Q' + ${detalle.precioUnitario}">-</td>
                <td th:text="'Q' + ${detalle.cantidad * detalle.precioUnitario}">-</td>
                <td th:text="${detalle.venta != null ? #temporals.format(detalle.venta.fecha, 'dd/MM/yyyy') : 'N/A'}">-</td>
            </tr>
            <tr th:if="${detalles.empty}">
                <td colspan="8" class="empty-message">No hay detalles de venta registrados</td>
            </tr>
            </tbody>
        </table>

        <!-- Total general -->
        <div class="total-general" th:if="${not detalles.empty}">
            <p> <span>Total de ingresos: </span> <span id="totalGeneralSpan">Q0</span></p>
        </div>
    </div>
</div>

<script>
    function cargarEstadisticas() {
        fetch('/api/detalle-venta')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalDetalles').innerText = data.length;

                let totalProductos = 0;
                let totalIngresos = 0;
                data.forEach(detalle => {
                    totalProductos += detalle.cantidad || 0;
                    totalIngresos += (detalle.cantidad || 0) * (detalle.precioUnitario || 0);
                });
                document.getElementById('totalProductosVendidos').innerText = totalProductos;
                document.getElementById('totalIngresos').innerText = 'Q' + totalIngresos.toFixed(2);
                document.getElementById('totalGeneralSpan').innerText = 'Q' + totalIngresos.toFixed(2);
            })
            .catch(e => console.log('No hay detalles'));
    }

    cargarEstadisticas();
</script>

</body>
</html>"<!-- Actualizacion 1 -->"
