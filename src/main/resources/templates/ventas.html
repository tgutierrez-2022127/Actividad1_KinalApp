<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas - KinalApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { color: #667eea; }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }
        .btn-volver { background: #6c757d; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1> Gestión de Ventas</h1>
    <a href="/" class="btn btn-volver">← Volver al inicio</a>
    <a href="/api/ventas" class="btn"> Ver API (JSON)</a>

    <h3> Lista de Ventas</h3>

    <table>
        <thead>
        <tr>
            <th>ID Venta</th>
            <th>Fecha</th>
            <th>Usuario ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${venta.idVenta}">1</td>
            <td th:text="${venta.fecha}">Fecha</td>
            <td th:text="${venta.usuario != null ? venta.usuario.id : 'N/A'}">Usuario ID</td>
        </tr>
        <tr th:if="${ventas.empty}">
            <td colspan="3" style="text-align:center">No hay ventas registradas</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
