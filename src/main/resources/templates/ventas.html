<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: #FFD700;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-success {
            background: #05DFA0;
            color: #1A1A2E;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(5, 223, 160, 0.3);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .btn-back:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        /* Tarjetas de estadisticas */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #FFD700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        /* Tabla */
        .table-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            color: #FFD700;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        td {
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .estado-pendiente { color: #F59E0B; }
        .estado-pagado { color: #05DFA0; }
        .estado-cancelado { color: #FF4757; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1A1A2E;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #FFD700;
        }

        .modal-content h2 {
            color: #FFD700;
            margin-bottom: 20px;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: white;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #FFD700;
        }

        .alert-success {
            background: rgba(5, 223, 160, 0.2);
            border: 1px solid #05DFA0;
            color: #05DFA0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> Sistema de Ventas</h1>
        <a href="/principal" class="btn btn-back">← Volver</a>
    </div>

    <!-- Estadisticas -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalClientes">0</div>
            <div class="stat-label">Clientes Registrados</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalProductos">0</div>
            <div class="stat-label">Productos en Inventario</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalVentas">0</div>
            <div class="stat-label">Ventas Realizadas</div>
        </div>
    </div>

    <!-- Botones de accion -->
    <div class="btn-group">
        <button class="btn btn-primary" onclick="abrirModalCliente()"> Nuevo Cliente</button>
        <button class="btn btn-primary" onclick="abrirModalProducto()"> Nuevo Producto</button>
        <button class="btn btn-success" onclick="abrirModalVenta()"> Nueva Venta</button>
    </div>

    <!-- Tabla de ventas -->
    <div class="table-container">
        <h2 style="color: #FFD700; margin-bottom: 15px;"> Listado de Ventas</h2>
        <div th:if="${exito}" class="alert-success" th:text="${exito}"></div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Codigo</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody id="tablaVentas">
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.idVenta}">-</td>
                <td th:text="${venta.codigoGenerico}">-</td>
                <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${venta.cliente != null ? venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente : 'N/A'}">-</td>
                <td th:text="${venta.producto != null ? venta.producto.nombre : 'N/A'}">-</td>
                <td th:text="${venta.cantidad}">-</td>
                <td th:text="${venta.precioUnitario != null ? 'Q' + venta.precioUnitario : '-'}">-</td>
                <td th:text="${venta.total != null ? 'Q' + venta.total : '-'}">-</td>
                <td>
                        <span th:class="${venta.estado == 'PENDIENTE' ? 'estado-pendiente' : (venta.estado == 'PAGADO' ? 'estado-pagado' : 'estado-cancelado')}"
                              th:text="${venta.estado}">-</span>
                </td>
            </tr>
            <tr th:if="${ventas.empty}">
                <td colspan="9" style="text-align: center;">No hay ventas registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal('modalCliente')">&times;</span>
        <h2>➕ Nuevo Cliente</h2>
        <input type="text" id="dpiCliente" placeholder="DPI">
        <input type="text" id="nombreCliente" placeholder="Nombre">
        <input type="text" id="apellidoCliente" placeholder="Apellido">
        <input type="text" id="direccionCliente" placeholder="Direccion">
        <button onclick="guardarCliente()">Guardar Cliente</button>
    </div>
</div>

<!-- Modal Producto -->
<div id="modalProducto" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal('modalProducto')">&times;</span>
        <h2>➕ Nuevo Producto</h2>
        <input type="text" id="nombreProducto" placeholder="Nombre del producto">
        <input type="text" id="descripcionProducto" placeholder="Descripcion">
        <input type="number" id="precioProducto" placeholder="Precio" step="0.01">
        <input type="number" id="stockProducto" placeholder="Stock">
        <button onclick="guardarProducto()">Guardar Producto</button>
    </div>
</div>

<!-- Modal Venta -->
<div id="modalVenta" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal('modalVenta')">&times;</span>
        <h2>🛒 Nueva Venta</h2>
        <select id="clienteVenta">
            <option value="">Seleccione un cliente</option>
        </select>
        <select id="productoVenta">
            <option value="">Seleccione un producto</option>
        </select>
        <input type="number" id="cantidadVenta" placeholder="Cantidad">
        <input type="text" id="precioVenta" placeholder="Precio unitario" readonly>
        <input type="text" id="totalVenta" placeholder="Total" readonly>
        <button onclick="guardarVenta()">Registrar Venta</button>
    </div>
</div>

<script>

    function cargarEstadisticas() {
        fetch('/api/clientes')
            .then(res => res.json())
            .then(data => document.getElementById('totalClientes').innerText = data.length)
            .catch(e => document.getElementById('totalClientes').innerText = '0');

        fetch('/api/productos')
            .then(res => res.json())
            .then(data => document.getElementById('totalProductos').innerText = data.length)
            .catch(e => document.getElementById('totalProductos').innerText = '0');

        fetch('/api/ventas')
            .then(res => res.json())
            .then(data => document.getElementById('totalVentas').innerText = data.length)
            .catch(e => document.getElementById('totalVentas').innerText = '0');
    }


    function abrirModalCliente() {
        document.getElementById('modalCliente').style.display = 'flex';
    }

    function guardarCliente() {
        const cliente = {
            dpiCliente: document.getElementById('dpiCliente').value,
            nombreCliente: document.getElementById('nombreCliente').value,
            apellidoCliente: document.getElementById('apellidoCliente').value,
            direccion: document.getElementById('direccionCliente').value,
            estado: 1
        };

        fetch('/api/clientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cliente)
        })
        .then(response => {
            if (response.ok) {
                alert('Cliente guardado exitosamente');
                cerrarModal('modalCliente');
                limpiarFormularioCliente();
                cargarEstadisticas();
                cargarClientesEnSelect();
                location.reload();
            } else {
                alert('Error al guardar cliente');
            }
        });
    }

    function limpiarFormularioCliente() {
        document.getElementById('dpiCliente').value = '';
        document.getElementById('nombreCliente').value = '';
        document.getElementById('apellidoCliente').value = '';
        document.getElementById('direccionCliente').value = '';
    }

    function cargarClientesEnSelect() {
        fetch('/api/clientes')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('clienteVenta');
                select.innerHTML = '<option value="">Seleccione un cliente</option>';
                data.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente.dpiCliente;
                    option.textContent = `${cliente.nombreCliente} ${cliente.apellidoCliente} - ${cliente.dpiCliente}`;
                    select.appendChild(option);
                });
            });
    }


    function abrirModalProducto() {
        document.getElementById('modalProducto').style.display = 'flex';
    }

    function guardarProducto() {
        const producto = {
            nombre: document.getElementById('nombreProducto').value,
            descripcion: document.getElementById('descripcionProducto').value,
            precio: parseFloat(document.getElementById('precioProducto').value),
            stock: parseInt(document.getElementById('stockProducto').value)
        };

        fetch('/api/productos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(producto)
        })
        .then(response => {
            if (response.ok) {
                alert('Producto guardado exitosamente');
                cerrarModal('modalProducto');
                limpiarFormularioProducto();
                cargarEstadisticas();
                cargarProductosEnSelect();
                location.reload();
            } else {
                alert('Error al guardar producto');
            }
        });
    }

    function limpiarFormularioProducto() {
        document.getElementById('nombreProducto').value = '';
        document.getElementById('descripcionProducto').value = '';
        document.getElementById('precioProducto').value = '';
        document.getElementById('stockProducto').value = '';
    }

    function cargarProductosEnSelect() {
        fetch('/api/productos')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('productoVenta');
                select.innerHTML = '<option value="">Seleccione un producto</option>';
                data.forEach(producto => {
                    const option = document.createElement('option');
                    option.value = producto.idProducto;
                    option.setAttribute('data-precio', producto.precio);
                    option.textContent = `${producto.nombre} - Q${producto.precio} (Stock: ${producto.stock})`;
                    select.appendChild(option);
                });
            });
    }


    function abrirModalVenta() {
        cargarClientesEnSelect();
        cargarProductosEnSelect();
        document.getElementById('modalVenta').style.display = 'flex';

        const cantidadInput = document.getElementById('cantidadVenta');
        const precioInput = document.getElementById('precioVenta');
        const totalInput = document.getElementById('totalVenta');
        const productoSelect = document.getElementById('productoVenta');

        productoSelect.onchange = function() {
            const precio = this.options[this.selectedIndex]?.getAttribute('data-precio') || 0;
            precioInput.value = precio;
            calcularTotal();
        };

        cantidadInput.onkeyup = function() {
            calcularTotal();
        };

        function calcularTotal() {
            const cantidad = parseFloat(cantidadInput.value) || 0;
            const precio = parseFloat(precioInput.value) || 0;
            totalInput.value = cantidad * precio;
        }
    }

    function guardarVenta() {
        const venta = {
            cliente: { dpiCliente: document.getElementById('clienteVenta').value },
            producto: { idProducto: document.getElementById('productoVenta').value },
            cantidad: parseInt(document.getElementById('cantidadVenta').value),
            precioUnitario: parseFloat(document.getElementById('precioVenta').value),
            total: parseFloat(document.getElementById('totalVenta').value),
            estado: "PENDIENTE"
        };

        if (!venta.cliente.dpiCliente || !venta.producto.idProducto || !venta.cantidad) {
            alert('Complete todos los campos');
            return;
        }

        fetch('/api/ventas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(venta)
        })
        .then(response => {
            if (response.ok) {
                alert('Venta registrada exitosamente');
                cerrarModal('modalVenta');
                limpiarFormularioVenta();
                cargarEstadisticas();
                location.reload();
            } else {
                alert('Error al registrar venta');
            }
        });
    }

    function limpiarFormularioVenta() {
        document.getElementById('clienteVenta').value = '';
        document.getElementById('productoVenta').value = '';
        document.getElementById('cantidadVenta').value = '';
        document.getElementById('precioVenta').value = '';
        document.getElementById('totalVenta').value = '';
    }


    function cerrarModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    // Inicializar
    cargarEstadisticas();
</script>

</body>
</html>
