<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .navbar h2 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 15px;
            border-radius: 10px;
        }
        .nav-links a:hover { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .user-info { color: #FFD700; margin-left: 20px; font-size: 14px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .card h2 { color: #FFD700; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 215, 0, 0.2); }
        th { color: #FFD700; }
        .action-link { color: #FFD700; text-decoration: none; }
        .action-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="navbar">
    <h2> KinalApp</h2>
    <div class="nav-links">
        <a th:href="@{/clientes}"> Clientes</a>
        <a th:href="@{/ventas}"> Ventas</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/productos}"> Productos</a>
        <a th:href="@{/logout}"> Cerrar Sesión</a>
        <span class="user-info">
             [[${#authentication.name}]] -
            <span sec:authorize="hasRole('ADMIN')">Administrador</span>
            <span sec:authorize="hasRole('USER')">Cliente</span>
        </span>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2> Listado de Ventas</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ventas/nuevo}" class="btn"> Nueva Venta</a>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Cliente DPI</th>
                <th>Producto ID</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.idVenta}"></td>
                <td th:text="${venta.clienteDpi}"></td>
                <td th:text="${venta.productoId}"></td>
                <td th:text="${venta.cantidad}"></td>
                <td th:text="${venta.total}"></td>
                <td th:text="${venta.fecha}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
