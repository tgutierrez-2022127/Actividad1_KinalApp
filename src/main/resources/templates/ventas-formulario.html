<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Nueva Venta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .navbar h2 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 15px;
            border-radius: 10px;
        }
        .nav-links a:hover { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .container { max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .form-card h2 { color: #FFD700; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #FFD700; }
        select, input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: white;
        }
        select option { background: #1A1A2E; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FFA500); color: #1A1A2E; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; }
    </style>
</head>
<body>
<div class="navbar">
    <h2>KinalApp</h2>
    <div class="nav-links">
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/logout}">Cerrar Sesion</a>
    </div>
</div>
<div class="container">
    <div class="form-card">
        <h2>Nueva Venta</h2>
        <form action="/ventas/guardar" method="post">
            <div class="form-group"><label>Cliente</label><select name="clienteDpi" required><option value="">Seleccione un cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.dpiCliente}" th:text="${cliente.nombreCliente}"></option></select></div>
            <div class="form-group"><label>Producto</label><select name="productoId" required><option value="">Seleccione un producto</option><option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombre}"></option></select></div>
            <div class="form-group"><label>Cantidad</label><input type="number" name="cantidad" min="1" required></div>
            <div class="form-group"><label>Fecha</label><input type="date" name="fecha" required></div>
            <div class="form-group"><label>Estado</label><select name="estado"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
            <div class="btn-group"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a></div>
        </form>
    </div>
</div>
</body>
</html>
