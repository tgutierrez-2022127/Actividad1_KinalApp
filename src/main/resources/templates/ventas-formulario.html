<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Nueva Venta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .navbar h2 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 24px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .nav-links a:hover { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .container { max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .form-card h2 { color: #FFD700; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #FFD700; font-weight: 500; }
        select, input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        select option { background: #1A1A2E; }
        select:focus, input:focus { outline: none; border-color: #FFD700; }
        .total-box {
            background: rgba(255, 215, 0, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: center;
        }
        .total-box label {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .total-value {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
        }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FFA500); color: #1A1A2E; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; }
        .precio-info {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h2> KinalApp</h2>
    <div class="nav-links">
        <a th:href="@{/clientes}"> Clientes</a>
        <a th:href="@{/ventas}"> Ventas</a>
        <a th:href="@{/productos}"> Productos</a>
        <a th:href="@{/logout}"> Cerrar Sesión</a>
    </div>
</div>
<div class="container">
    <div class="form-card">
        <h2> Nueva Venta</h2>

        <form action="/ventas/guardar" method="post" id="ventaForm">
            <div class="form-group">
                <label> Cliente</label>
                <select name="clienteDpi" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.dpiCliente}"
                            th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label> Producto</label>
                <select name="productoId" id="productoSelect" required>
                    <option value="">Seleccione un producto</option>
                    <option th:each="producto : ${productos}"
                            th:value="${producto.idProducto}"
                            th:text="${producto.nombre}"
                            th:data-precio="${producto.precio}">
                    </option>
                </select>
                <div class="precio-info" id="precioInfo"></div>
            </div>

            <div class="form-group">
                <label> Cantidad</label>
                <input type="number" name="cantidad" id="cantidad" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label> Fecha</label>
                <input type="date" name="fecha" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required>
            </div>

            <div class="form-group">
                <label> Estado</label>
                <select name="estado">
                    <option value="1"> Activo</option>
                    <option value="0"> Inactivo</option>
                </select>
            </div>

            <div class="total-box">
                <label> TOTAL DE LA VENTA</label>
                <div class="total-value" id="totalValue">Q 0.00</div>
            </div>

            <input type="hidden" name="total" id="totalHidden">

            <div class="btn-group">
                <button type="submit" class="btn btn-primary"> Guardar Venta</button>
                <a th:href="@{/ventas}" class="btn btn-secondary"> Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Datos de productos con sus precios
    const productos = [];

    // Cargar productos desde Thymeleaf a JavaScript
    th:each="producto : ${productos}";

    // Función para calcular el total
    function calcularTotal() {
        const select = document.getElementById('productoSelect');
        const cantidad = document.getElementById('cantidad').value;
        const selectedOption = select.options[select.selectedIndex];
        const precio = selectedOption ? parseFloat(selectedOption.getAttribute('data-precio')) : 0;

        if (precio > 0 && cantidad > 0) {
            const total = precio * parseInt(cantidad);
            document.getElementById('totalValue').innerText = 'Q ' + total.toFixed(2);
            document.getElementById('totalHidden').value = total;
            document.getElementById('precioInfo').innerHTML = ' Precio unitario: Q ' + precio.toFixed(2);
        } else {
            document.getElementById('totalValue').innerText = 'Q 0.00';
            document.getElementById('totalHidden').value = 0;
            document.getElementById('precioInfo').innerHTML = '';
        }
    }

    // Agregar event listeners
    document.getElementById('productoSelect').addEventListener('change', calcularTotal);
    document.getElementById('cantidad').addEventListener('input', calcularTotal);

    // Calcular al cargar la página
    window.onload = function() {
        calcularTotal();
    };
</script>
</body>
</html>
