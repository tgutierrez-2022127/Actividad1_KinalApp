<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Cliente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h1 { color: #FFD700; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #FFD700; }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: white;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-back {
            background: transparent;
            border: 1px solid #FFD700;
            color: #FFD700;
            text-align: center;
            display: inline-block;
            text-decoration: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1> Nuevo Cliente</h1>
    <form action="/clientes/guardar" method="post">
        <div class="form-group">
            <label>DPI</label>
            <input type="text" name="dpiCliente" required>
        </div>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombreCliente" required>
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" name="apellidoCliente" required>
        </div>
        <div class="form-group">
            <label>Dirección</label>
            <input type="text" name="direccion" required>
        </div>
        <button type="submit" class="btn"> Guardar Cliente</button>
        <a href="/clientes-view" class="btn btn-back">← Cancelar</a>
    </form>
</div>
</body>
</html>
